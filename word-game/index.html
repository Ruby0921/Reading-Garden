<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>找单字游戏</title>
<style>body{font-family:Arial,sans-serif;background:#eaf7ff;color:#234;text-align:center;padding:2rem}#status{font-size:1.1rem}</style></head>
<body><p id="status">正在载入找单字游戏，请稍候……</p>
<script>
(async()=>{try{
const parts=["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06.txt","part-07.txt","part-08.txt","part-09.txt"];
const textParts=await Promise.all(parts.map(async p=>{const r=await fetch(p);if(!r.ok)throw new Error("载入失败："+p);return r.text()}));
const gameHtml=textParts.join("");
document.open();document.write(gameHtml);document.close();
}catch(e){document.getElementById("status").textContent="游戏载入失败，请刷新页面后重试。"+e.message;}})();
</script></body></html>
