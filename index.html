<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>阅读乐园</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="sun">☀️</div>

    <div class="rainbow"></div>

    <div class="grass"></div>

</div>

<div class="container">

    <h1 class="logo">
        📚 阅读乐园
    </h1>

    <p class="subtitle">
        快乐阅读 · 天天进步
    </p>

    <div class="book">

        <div class="rabbit">
            🐰
        </div>

        <div class="book-cover">

            <div class="book-title">
                第四册
            </div>

            <div class="book-name">
                《我的家人》
            </div>

            <div class="book-icon">
                📖
            </div>

        </div>

    </div>

    <button id="startBtn">
        🌟 开始学习 🌟
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
