<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1.5.4.2.1 开口读一读</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(135deg,#ffe1ec,#fff3d6 55%,#c9efff);min-height:100vh;display:grid;place-items:center;color:#8b183c;padding:16px}
.app{width:min(960px,100%);min-height:90vh;background:#fff9f0;border:8px solid #ffc4d8;border-radius:32px;box-shadow:0 12px 0 #eaa2bc,0 18px 40px #ad557544;padding:clamp(16px,4vw,36px);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
h1{margin:0;background:linear-gradient(#ff9fc2,#ff6e9d);color:white;text-shadow:2px 3px #b92355;border-radius:28px;padding:12px 26px;font-size:clamp(28px,5vw,52px);border:4px solid white}
.sub{font-size:clamp(17px,2.5vw,25px);font-weight:800;color:#bd2446;margin:0}
.card{width:min(330px,72vw);aspect-ratio:1;background:#fff0d9;border:7px solid #f5d8b8;border-radius:32px;display:grid;place-items:center;box-shadow:inset 0 0 0 5px #fff9ef}
.character{font-size:clamp(130px,28vw,230px);line-height:1;color:#4a2412;font-weight:800}
.buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%}
button{border:4px solid white;border-radius:26px;padding:18px 24px;min-width:min(240px,42vw);font-size:clamp(21px,3vw,30px);font-weight:900;cursor:pointer;box-shadow:0 6px 0 #c3b0aa;transition:transform .12s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #c3b0aa}
.listen{background:#aee4ff;color:#0767cb}.read{background:#ffb6cc;color:#c51c43}
#feedback{width:100%;max-width:650px;min-height:70px;border-radius:22px;padding:14px;background:#fff;border:3px dashed #ffc0d4;font-size:clamp(18px,2.4vw,24px);font-weight:800;display:grid;place-items:center}
#back{min-width:0;font-size:17px;padding:10px 18px;background:#fff;color:#8b183c}
.note{font-size:14px;color:#76545e;max-width:650px}
</style></head>
<body><main class="app">
<h1>🎤 开口读一读</h1><p class="sub">看着单字，大声读出来吧！</p>
<div class="card" aria-label="目标单字"><div class="character">天</div></div>
<div class="buttons"><button class="listen" id="listen">🔊 听一听</button><button class="read" id="read">🎙️ 我来读</button></div>
<div id="feedback" role="status" aria-live="polite">准备好了吗？先听一听，再试着读“天”！</div>
<button id="back">← 返回阅读本</button>
<p class="note">语音识别需使用支持中文语音识别的浏览器（建议最新版 Chrome），并允许麦克风权限。若浏览器不支持，会显示提示，不会假装判定答对。</p>
</main>
<script>
const feedback=document.getElementById('feedback');
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
document.getElementById('listen').addEventListener('click',()=>{speak('天');feedback.textContent='👂 请听：天。轮到你来读啦！'});
document.getElementById('read').addEventListener('click',()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){feedback.textContent='当前浏览器不支持语音识别。请使用最新版 Chrome，并允许麦克风权限。';return}
 const rec=new SR();rec.lang='zh-CN';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;
 feedback.textContent='🎙️ 正在听，请清楚地读出：天';
 rec.onresult=e=>{
  const alts=Array.from(e.results[0]).map(x=>x.transcript.trim());
  const normalized=alts.map(x=>x.replace(/[，。！？、\s]/g,''));
  const ok=normalized.some(x=>x==='天'||x.includes('天'));
  if(ok){feedback.textContent='🌟 太棒了！你读对了！🌟';speak('太棒了，你读对了！')}
  else{feedback.textContent='听到的是：“'+alts[0]+'”。再试一次，你可以的！';speak('再试一次，你可以的')}
 };
 rec.onerror=e=>{const msgs={not-allowed:'麦克风权限未开启，请在浏览器地址栏允许麦克风。',no-speech:'没有听到声音，请靠近麦克风再试一次。',network:'语音识别网络连接失败，请检查网络后重试。',audio-capture:'没有找到麦克风，请检查设备连接。'};feedback.textContent=msgs[e.error]||('语音识别暂时无法使用：'+e.error)};
 rec.onend=()=>{};
 try{rec.start()}catch(e){feedback.textContent='无法开始录音，请稍等片刻再试。'}
});
document.getElementById('back').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='./'});
</script></body></html>
